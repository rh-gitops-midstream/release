  - name: argo-rollouts
    buildRef: "quay.io/redhat-user-workloads/rh-openshift-gitops-tenant/argo-rollouts-rhel8"
    releaseRef: "registry.redhat.io/openshift-gitops-1/argo-rollouts-rhel8"
