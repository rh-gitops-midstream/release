apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    {{- include "openshift-gitops-operator.labels" . | nindent 4 }}
  name: openshift-gitops-operator-controller-manager-webhook-service
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 443
  selector:
    control-plane: gitops-operator
status:
  loadBalancer: {}
