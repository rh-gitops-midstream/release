name: Test Agent Helm Chart Package (PR)

on:
  pull_request:
    paths:
      - hack/generate-agent-helm-chart.py
      - helm-charts/redhat-argocd-agent/**

permissions:
  contents: read

jobs:
  test-agent-helm-chart-package:
    name: Test make agent-helm-chart-package
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          submodules: true

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Run package target
        run: make agent-helm-chart-package
