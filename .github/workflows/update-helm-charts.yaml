name: Update Helm Charts

# Dispatch only. Chaining off `workflow_run` from Build Release Candidate does
# not work: that workflow is schedule-driven, so its runs always sit on the
# default branch and head_branch is "main" regardless of which release branch
# it actually built. It dispatches us instead, passing the real target.
on:
  workflow_dispatch:
    inputs:
      TARGET_BRANCH:
        description: 'Branch to update helm charts for (main or release-1.23+)'
        required: true
        type: string

permissions: {}

# Serialise per target branch: two runs would otherwise push the same PR branch
# and clobber each other's chart commit.
concurrency:
  group: update-helm-charts-${{ inputs.TARGET_BRANCH }}
  cancel-in-progress: false

jobs:
  update-helm-charts:
    name: Update Helm Charts from Bundle Image
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    # Only main and release-* carry published charts.
    if: inputs.TARGET_BRANCH == 'main' || startsWith(inputs.TARGET_BRANCH, 'release-')

    permissions:
      checks: read
      contents: write
      pull-requests: write

    steps:
      # ──────────────────────────────────────────────
      # Setup
      # ──────────────────────────────────────────────

      - name: Determine target branch
        id: branch
        env:
          TARGET_BRANCH: ${{ inputs.TARGET_BRANCH }}
        run: |
          set -euo pipefail

          # Strict gate (job-level `if` can't regex): main or release-X.Y >= 1.23.
          # Keep in sync with the dispatch gate in build-release-candidate.yaml.
          if [[ "$TARGET_BRANCH" != "main" ]]; then
            if [[ ! "$TARGET_BRANCH" =~ ^release-([0-9]+)\.([0-9]+)$ ]] || \
               (( 10#${BASH_REMATCH[1]} < 1 || (10#${BASH_REMATCH[1]} == 1 && 10#${BASH_REMATCH[2]} < 23) )); then
              echo "Refusing to update charts on branch '$TARGET_BRANCH' (expected main or release-1.23+)."
              exit 1
            fi
          fi

          echo "target=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Using branch: $TARGET_BRANCH"

      - name: Checkout code
        uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.0.0
        with:
          fetch-depth: 0
          ref: ${{ steps.branch.outputs.target }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo podman

      - name: Log in to quay.io
        env:
          QUAY_USERNAME: ${{ secrets.KONFLUX_QUAY_USERNAME }}
          QUAY_TOKEN: ${{ secrets.KONFLUX_QUAY_TOKEN }}
        run: |
          # kubectl-catalog resolves registry auth via authn.DefaultKeychain,
          # which reads ~/.docker/config.json - not podman's default authfile.
          mkdir -p ~/.docker
          printf '%s' "$QUAY_TOKEN" | podman login quay.io \
            --username "$QUAY_USERNAME" --password-stdin \
            --authfile ~/.docker/config.json

      # ──────────────────────────────────────────────
      # Install kubectl-catalog
      # ──────────────────────────────────────────────

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install kubectl-catalog
        env:
          # Built from a pinned commit, not the v0.0.1 release: that asset was
          # built from c27a5e8 (2026-09-13) and predates --bundle, which
          # hack/update-helm-chart.sh needs. Release tags and their assets are
          # mutable anyway; a commit SHA is not.
          # 61886c09 = "Added support for mirror ... and ability to use bundle
          # images directly". The --check-flags call below verifies every flag
          # the script uses, so a bad bump fails here, not after the Konflux wait.
          KUBECTL_CATALOG_COMMIT: 61886c09461d099d0b8bab10ad4b6071f6ca8da1
        run: |
          set -euo pipefail
          go install "github.com/anandf/kubectl-catalog@${KUBECTL_CATALOG_COMMIT}"
          sudo install -m 0755 "$(go env GOPATH)/bin/kubectl-catalog" /usr/local/bin/
          kubectl-catalog version
          hack/update-helm-chart.sh --check-flags

      # ──────────────────────────────────────────────
      # Determine bundle image ref
      # ──────────────────────────────────────────────

      - name: Get bundle image ref
        id: bundle
        run: |
          set -euo pipefail
          VERSION=$(yq -r '.release.version' config.yaml)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release.version '${VERSION}' in config.yaml"
            exit 1
          fi

          # Bundle image is tagged with the release version (e.g. v1.23.0).
          BUILD="v${VERSION}"
          BUNDLE_IMAGE="quay.io/redhat-user-workloads/rh-openshift-gitops-tenant/gitops-operator-bundle:${BUILD}"
          echo "bundle_image=$BUNDLE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Bundle image: $BUNDLE_IMAGE"

      # ──────────────────────────────────────────────
      # Wait: bundle image tag
      # Immediate no-op when dispatched by build-release-candidate (it already
      # waited); the real wait is for manual runs on a freshly built bundle.
      # ──────────────────────────────────────────────

      - name: "Wait: Bundle image tag exists"
        env:
          BUNDLE_IMAGE: ${{ steps.bundle.outputs.bundle_image }}
        run: |
          set -uo pipefail
          OVERALL_TIMEOUT=7200
          SECONDS=0

          echo "Waiting for ${BUNDLE_IMAGE}..."
          while true; do
            if skopeo inspect --retry-times 3 --authfile ~/.docker/config.json \
                 "docker://${BUNDLE_IMAGE}" >/dev/null 2>/tmp/skopeo-err; then
              echo "Found ${BUNDLE_IMAGE}."
              exit 0
            fi
            # Only a missing tag is worth retrying; auth/ref errors never heal.
            if ! grep -qiE 'manifest unknown|name unknown|not found|404' /tmp/skopeo-err; then
              echo "skopeo failed with a non-retryable error:"
              cat /tmp/skopeo-err
              exit 1
            fi
            if (( SECONDS >= OVERALL_TIMEOUT )); then
              echo "Timed out waiting for ${BUNDLE_IMAGE}. Last error:"
              cat /tmp/skopeo-err
              exit 1
            fi
            echo "Not available yet; retrying in 60s..."
            sleep 60
          done

      # ──────────────────────────────────────────────
      # Regenerate helm-charts/openshift-gitops-operator (CRDs in its crds/).
      # All chart edits live in the script so they can be run locally too.
      # ──────────────────────────────────────────────

      - name: Update helm chart from bundle image
        env:
          BUNDLE_IMAGE: ${{ steps.bundle.outputs.bundle_image }}
        run: hack/update-helm-chart.sh "${BUNDLE_IMAGE}"

      # ──────────────────────────────────────────────
      # Open pull request
      # ──────────────────────────────────────────────

      # Branch is keyed on build + target, not the run id: a re-run for the same
      # build updates the open PR instead of leaving a trail of stale ones.
      # No-op when the charts are unchanged - the action creates nothing.
      - name: Create pull request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          base: ${{ steps.branch.outputs.target }}
          branch: build/helm-charts-${{ steps.bundle.outputs.build }}-${{ steps.branch.outputs.target }}
          delete-branch: true
          add-paths: |
            helm-charts/openshift-gitops-operator/
          # Records the exact bundle: the Chart.yaml annotations cannot, since
          # the bundle has no annotation of its own.
          commit-message: |
            chore(helm-charts): update chart from bundle ${{ steps.bundle.outputs.build }}

            Bundle image: ${{ steps.bundle.outputs.bundle_image }}
          title: "chore(helm-charts): update chart from bundle ${{ steps.bundle.outputs.build }} [${{ steps.branch.outputs.target }}]"
          body: |
            Regenerates the `openshift-gitops-operator` helm chart (CRDs included) from the bundle image with `hack/update-helm-chart.sh`.

            **Build:** `${{ steps.bundle.outputs.build }}`
            **Bundle image:** `${{ steps.bundle.outputs.bundle_image }}`

            Automatically generated by GitHub Actions.

      - name: Report result
        run: |
          if [[ -z "${{ steps.create_pr.outputs.pull-request-number }}" ]]; then
            echo "No helm chart changes. No pull request created."
          else
            echo "PR #${{ steps.create_pr.outputs.pull-request-number }} (${{ steps.create_pr.outputs.pull-request-operation }}): ${{ steps.create_pr.outputs.pull-request-url }}"
          fi

  notify-failure:
    name: Notify Slack on Failure
    runs-on: ubuntu-24.04
    needs: update-helm-charts
    # cancelled() too: concurrency drops superseded pending runs, and a silently
    # cancelled chart update looks identical to one that never fired.
    if: failure() || cancelled()

    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":red_circle: *Helm chart update ${{ needs.update-helm-charts.result }}*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":red_circle: *Helm chart update ${{ needs.update-helm-charts.result }}*\n*Branch:* `${{ inputs.TARGET_BRANCH }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                  }
                }
              ]
            }
