name: Setup New Release

on:
  workflow_dispatch:
    inputs:
      TARGET_BRANCH:
        description: 'Branch to setup release for (e.g. release-1.22)'
        required: true
        type: string

permissions: {}

jobs:
  setup-release:
    name: Setup New Release
    runs-on: ubuntu-24.04

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.TARGET_BRANCH }}
          token: ${{ secrets.GH_TOKEN }}
          submodules: true

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          . ./hack/deps.sh

          CURRENT_VERSION=$($YQ e '.release.version' config.yaml)
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"

          # Compute skip-range
          if [ "$NEXT_PATCH" -gt 0 ]; then
            SKIP_RANGE=">=${MAJOR}.${MINOR}.0 <${NEXT_VERSION}"
          else
            SKIP_RANGE=">=1.0.0 <${NEXT_VERSION}"
          fi

          # Determine if this is the latest release branch
          LATEST_BRANCH=$(git branch -r --list 'origin/release-*' | sed 's|origin/||' | sort -t. -k2,2n | tail -1 | tr -d ' ')
          IS_LATEST="false"
          if [ "${{ inputs.TARGET_BRANCH }}" = "$LATEST_BRANCH" ] || [ "${{ inputs.TARGET_BRANCH }}" = "main" ]; then
            IS_LATEST="true"
          fi

          if [ "$IS_LATEST" = "true" ]; then
            CHANNEL="latest,gitops-${MAJOR}.${MINOR}"
          else
            CHANNEL="gitops-${MAJOR}.${MINOR}"
          fi

          echo "current=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip_range=$SKIP_RANGE" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          echo "Current version: $CURRENT_VERSION"
          echo "Next version:    $NEXT_VERSION"
          echo "Skip range:      $SKIP_RANGE"
          echo "Latest branch:   $LATEST_BRANCH"
          echo "Is latest:       $IS_LATEST"
          echo "Channel:         $CHANNEL"

      - name: Update config.yaml
        run: |
          set -euo pipefail
          . ./hack/deps.sh

          VERSION="${{ steps.version.outputs.next }}"
          CURRENT="${{ steps.version.outputs.current }}"
          SKIP_RANGE="${{ steps.version.outputs.skip_range }}"
          MAJOR="${{ steps.version.outputs.major }}"
          MINOR="${{ steps.version.outputs.minor }}"

          $YQ e -i ".release.version = \"$VERSION\"" config.yaml
          $YQ e -i ".release.olm.name = \"openshift-gitops-operator.v${VERSION}\"" config.yaml
          $YQ e -i ".release.olm.replaces = \"openshift-gitops-operator.v${CURRENT}\"" config.yaml
          $YQ e -i ".release.olm.skip-range = \"${SKIP_RANGE}\"" config.yaml
          CHANNEL="${{ steps.version.outputs.channel }}"
          $YQ e -i ".release.olm.channel = \"${CHANNEL}\"" config.yaml

          echo "Updated config.yaml:"
          $YQ e '.release' config.yaml

      - name: Run setup-release
        run: make setup-release

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): setup v${{ steps.version.outputs.next }}"
          branch: release/v${{ steps.version.outputs.next }}
          delete-branch: true
          base: ${{ inputs.TARGET_BRANCH }}
          title: "chore(release): setup v${{ steps.version.outputs.next }}"
          body: |
            Setup release `v${{ steps.version.outputs.next }}` on `${{ inputs.TARGET_BRANCH }}`.

            **Version bump:** `${{ steps.version.outputs.current }}` → `${{ steps.version.outputs.next }}`

            **Changes:**
            - `config.yaml`: version, OLM metadata (name, replaces, skip-range, channel)
            - `BUILD`: reset build counter
            - `.tekton/`: updated Konflux pipeline references
            - `containers/`: updated CPE labels

            Automatically generated by GitHub Actions.
