name: Update Sources

on:
  schedule:
    - cron: '0 18 * * *'

  workflow_dispatch:
    inputs:
      TARGET_BRANCH:
        description: 'Branch to update sources for (e.g. release-1.21, main)'
        required: true
        type: string

permissions: {}

jobs:
  compute-matrix:
    runs-on: ubuntu-24.04
    outputs:
      branches: ${{ steps.set.outputs.branches }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'branches=["${{ inputs.TARGET_BRANCH }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'branches=["main","release-1.21","release-1.20","release-1.19"]' >> "$GITHUB_OUTPUT"
          fi

  update-sources:
    needs: compute-matrix
    name: Update Sources (${{ matrix.branch }})
    runs-on: ubuntu-24.04
    permissions:
      checks: read
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.compute-matrix.outputs.branches) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.0.0
        with:
          fetch-depth: 0
          ref: ${{ matrix.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update sources
        run: make update-sources

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(update-sources): refresh source commits"
          branch: chore/update-sources-${{ matrix.branch }}-${{ github.run_id }}
          base: ${{ matrix.branch }}
          delete-branch: true
          title: "chore(update-sources): refresh source commits [${{ matrix.branch }}]"
          body: |
            This PR refreshes source commits by running `make update-sources`.

            Automatically generated by GitHub Actions.
          labels: ${{ github.event_name == 'schedule' && 'auto-merge' || '' }}

      - name: Wait for Red Hat Konflux checks
        if: github.event_name == 'schedule' && steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pull-request-number }}"
          REPO="${{ github.repository }}"
          CHECK_CREATION_TIMEOUT=300
          OVERALL_TIMEOUT=10800
          SECONDS=0

          while (( SECONDS < OVERALL_TIMEOUT )); do
            CHECKS=$(gh pr checks "$PR_NUMBER" --repo "$REPO" \
              --json name,state || true)

            KONFLUX=$(jq \
              '[.[] | select(.name | contains("Red Hat Konflux"))]' \
              <<< "$CHECKS")

            TOTAL=$(jq 'length' <<< "$KONFLUX")

            if (( TOTAL == 0 )); then
              if (( SECONDS >= CHECK_CREATION_TIMEOUT )); then
                echo "No Red Hat Konflux checks were created within 5 minutes."
                exit 1
              fi

              echo "Waiting for Konflux checks to be created..."
              sleep 60
              continue
            fi

            PENDING=$(jq '
              [.[] | select(
                .state == "PENDING" or
                .state == "QUEUED" or
                .state == "IN_PROGRESS" or
                .state == "WAITING" or
                .state == "REQUESTED"
              )] | length
            ' <<< "$KONFLUX")

            if (( PENDING > 0 )); then
              echo "Waiting for Konflux checks to complete... ($PENDING pending)"
              sleep 60
              continue
            fi

            FAILED=$(jq '
              [.[] | select(
                .state != "SUCCESS" and
                .state != "NEUTRAL"
              )] | length
            ' <<< "$KONFLUX")

            if (( FAILED > 0 )); then
              echo "One or more Konflux checks failed."
              jq -r '
                .[] |
                select(.state != "SUCCESS" and .state != "NEUTRAL") |
                "\(.name): \(.state)"
              ' <<< "$KONFLUX"
              exit 1
            fi

            echo "All Red Hat Konflux checks completed successfully."
            exit 0
          done

          echo "Timed out waiting for Red Hat Konflux checks."
          exit 1

      - name: Merge Pull Request
        if: github.event_name == 'schedule' && steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} --squash --delete-branch

      - name: Close pull request if not merged
        if: always() && github.event_name == 'schedule' && steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.create_pr.outputs.pull-request-number }}"
          REPO="${{ github.repository }}"

          sleep 10

          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq '.state')

          if [[ "$STATE" == "OPEN" ]]; then
            gh pr close "$PR_NUMBER" \
              --repo "$REPO" \
              --comment "Automatically closed because the scheduled update could not be merged."
          fi
