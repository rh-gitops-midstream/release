name: Update Sources

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      skip_main:
        description: 'Skip updates for main/master branch refs'
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  update-sources:
    name: Update Sources
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Set up Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update sources with skip-main
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_main == 'true' || github.ref_name != 'main' && github.ref_name != 'master')
        run: make update-sources SKIP_MAIN=true

      - name: Update sources without skip-main
        if: github.event_name == 'workflow_dispatch' && (github.event.inputs.skip_main == 'false' || github.ref_name == 'main' || github.ref_name == 'master')
        run: make update-sources

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(update-sources): refresh source commits"
          branch: chore/update-sources-${{ github.run_id }}
          delete-branch: true
          title: "chore(update-sources): refresh source commits"
          body: |
            This PR refreshes source commits by running `make update-sources`.

            Automatically generated by GitHub Actions.
          labels: |
            auto-merge

      - name: Enable auto-merge
        if: github.event_name == 'schedule' && steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh pr merge ${{ steps.create_pr.outputs.pull-request-number }} --squash --auto